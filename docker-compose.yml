services:
  api:
    build: ./backend
    command: ["/app/api"]
    env_file: .env
    environment:
      # Let Go's GC work against the container limit instead of discovering it
      # by being killed. Keep this below mem_limit.
      GOMEMLIMIT: "3GiB"
    ports:
      # UI proxies /api → api:8081 on the compose network. Host 8081 is often
      # taken by other stacks; publish a high port only for direct API access.
      - "18081:8081"
    volumes:
      - upload-data:/data/uploads
    # a parse that still runs the container out of memory should come back
    # rather than leave nginx talking to a dead upstream (502 Bad Gateway)
    restart: unless-stopped
    mem_limit: 4g

  worker:
    build: ./backend
    command: ["/app/worker"]
    env_file: .env
    volumes:
      - upload-data:/data/uploads
    # Stub today — enable with: docker compose --profile full up
    profiles: ["full"]

  # Target backing stores (not used by the in-memory Phase-1 API yet).
  # Start with: docker compose --profile full up --build
  # MinIO Community images were removed from Docker Hub (Sep 2026); when you
  # need object storage, build MinIO from source or swap in another S3 target.
  postgres:
    image: timescale/timescaledb:latest-pg16
    profiles: ["full"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pantsa}
      POSTGRES_USER: ${POSTGRES_USER:-pantsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    profiles: ["full"]
    volumes:
      - redis-data:/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on: [api]
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  upload-data:
